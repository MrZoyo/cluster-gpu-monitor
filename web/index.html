<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- GitHub Pages 不能自定义响应头；正式部署还会由 Caddy 下发更完整的 CSP/安全头。 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-src 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>GPU 集群占用监控</title>
  <script src="/js/recovery.js"></script>
  <link rel="icon" type="image/svg+xml" href="./icons/rocket.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-location">
      <span class="title" id="title">GPU Monitor</span>
      <nav id="moduleNav" class="module-switch" aria-label="Modules" hidden></nav>
      <span class="crumb" id="crumb">总览</span>
    </div>
    <div class="topbar-controls">
      <span class="navlink" id="navRank">
        <img src="/icons/rocket.svg" class="navlink-icon" alt="">
        <span id="navRankText">用户排行</span>
      </span>
      <div class="lang-switch" id="langSwitch"></div>
      <div class="theme-switch" id="themeSwitch"></div>
      <div class="topbar-window">
        <img src="/icons/clock.svg" class="topbar-icon" alt="">
        <div class="win-switch" id="winSwitch"></div>
      </div>
    </div>
    <div class="health" title="">
      <span class="dot" id="hdot"></span>
      <span id="htext">加载中…</span>
    </div>
  </div>
  <div class="wrap"><div id="sourceNotice" class="source-notice" hidden></div><div id="view"></div></div>

  <script src="/vendor/echarts.min.js?v=6.1.0"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/refresh.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/overview.js"></script>
  <script src="/js/cluster.js"></script>
  <script src="/js/host.js"></script>
  <script src="/js/gpu.js"></script>
  <script src="/js/ranking.js"></script>
  <script src="/js/pai.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
